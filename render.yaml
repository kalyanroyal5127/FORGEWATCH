services:
  - type: web
    name: forgewatch
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m backend.train_model
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: FORGEWATCH_SECRET_KEY
        generateValue: true
      - key: FORGEWATCH_ADMIN_USERNAME
        sync: false
      - key: FORGEWATCH_ADMIN_PASSWORD
        sync: false
      - key: GUNICORN_CMD_ARGS
        value: --preload --access-logfile -
